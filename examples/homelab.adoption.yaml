# Example adoption manifest — Homelab (infrastructure & operations)
# Adopt the shared engineering/security/agent floors. Private topology,
# host inventory, DNS zones, and configuration stay local to the homelab
# repository — nothing private is copied into the shared library.
schema: play-nice/adoption-v1
project: homelab
source:
  repository: Rylee-Bee/play-nice-contracts
  revision: 0000000   # pin to the adopted commit SHA

always:
  - truth-and-evidence
  - ask-for-help
  - status-and-state
  - recovery-and-history

triggers:
  external-api:
    - calling-other-services
    - capabilities-not-vendors
    - events-and-caching
    - versions-and-discovery
  security:
    - secrets-and-data
    - identity-and-roles
    - public-and-private
  agent:
    - agent-behavior
    - bounded-work
    - orchestration
    - handoff-and-continuity
    - contract-proof
  git:
    - git-and-worktrees
  engineering:
    - testing-and-evidence
    - search-before-building
    - observability
  operations:
    - status-and-state
    - attention-and-quiet
    - observability

notes: >-
  Infrastructure benefits most from: prove-stale-before-clean git worktree
  discipline, secrets by symbolic reference only, least-privilege per
  service, honest status vocabulary across dashboards/scripts, and quiet
  monitoring that surfaces exceptions instead of green noise. Private
  topology never enters the shared library; only the reusable lessons do.