# Example adoption manifest — Personal World (broad adoption)
# Projects consume contracts; they do not fork them. Project-specific
# contracts (companion integration, finish-line product rules, setup-wizard
# flows, etc.) stay local to the Personal World repository.
schema: play-nice/adoption-v1
project: personal-world
source:
  repository: Rylee-Bee/play-nice-contracts
  revision: 0000000   # pin to the adopted commit SHA

always:
  - truth-and-evidence
  - ask-for-help
  - working-together
  - human-reliability
  - recovery-and-history
  - status-and-state
  - ownership-and-portability

triggers:
  human-facing:
    - accessibility
    - attention-and-quiet
    - depth-on-demand
    - what-why-next
    - plain-language
  ui:
    - accessibility
    - sensory-safety
    - themes-and-personalization
    - web-ui
    - design-fidelity
  design:
    - design-fidelity
  external-api:
    - capabilities-not-vendors
    - calling-other-services
    - versions-and-discovery
    - events-and-caching
  api:
    - api
    - versions-and-discovery
    - status-and-state
    - one-truth-two-views
  cli:
    - cli
  security:
    - identity-and-roles
    - secrets-and-data
    - public-and-private
  agent:
    - agent-behavior
    - bounded-work
    - orchestration
    - handoff-and-continuity
    - contract-proof
  engineering:
    - testing-and-evidence
    - search-before-building
    - git-and-worktrees
    - handoff-and-continuity
    - observability

notes: >-
  Broad adoption: Personal World is human-facing, provider-rich, agent-built,
  and design-heavy, so nearly the full library applies. Companion/theme
  product rules and the finish-line document remain local; this manifest
  governs only the shared floors.