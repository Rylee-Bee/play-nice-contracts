# Example adoption manifest — Personal World (broad adoption)
# Projects consume contracts; they do not fork them. Project-specific
# contracts (companion integration, finish-line product rules, setup-wizard
# flows, etc.) stay local to the Personal World repository.
schema: play-nice/adoption-v1
project: personal-world
source:
  repository: burgeswe/play-nice-contracts
  revision: 0000000   # pin to the adopted commit SHA

always:
  - ask-for-help
  - participation-and-contribution
  - mutual-contribution
  - collaborative-good-faith
  - truth-and-evidence
  - human-reliability
  - recovery-and-reversibility
  - provenance-and-audit
  - explicit-state
  - stable-truth-replaceable-machinery

triggers:
  human-facing:
    - accessibility-floor
    - attention-and-focus
    - complexity-on-demand
    - what-why-next
    - quiet-when-healthy
    - progressive-disclosure
    - guide-me
    - copy-and-language
  ui:
    - low-vision-and-reflow
    - migraine-and-sensory-safety
    - themes-and-personalization
    - motion-and-feedback
    - web-ui
    - visual-fidelity-and-composition
  design:
    - design-source-and-fidelity
    - visual-fidelity-and-composition
  external-api:
    - capability-first
    - friendly-api-client
    - provider-neutrality
    - discovery-and-negotiation
    - idempotency
    - polling-webhooks-and-caching
    - external-mutations
  api:
    - api
    - versioning-and-compatibility
    - failure-and-degradation
    - machine-readable-output
    - human-and-machine-parity
  cli:
    - cli
  security:
    - authorization
    - authentication
    - secrets
    - data-classification
    - public-private-boundaries
    - least-privilege
  agent:
    - agent-behavior
    - bounded-work
    - orchestration
    - worker-contract
    - review-and-integration
    - handoff
    - contract-attestation
    - model-routing
  engineering:
    - deterministic-first
    - search-before-inventing
    - testing-and-verification
    - dependency-discipline
    - git-and-worktrees
    - documentation-and-continuity
    - migrations
    - observability

notes: >-
  Broad adoption: Personal World is human-facing, provider-rich, agent-built,
  and design-heavy, so nearly the full library applies. Companion/theme
  product rules and the finish-line document remain local; this manifest
  governs only the shared floors.