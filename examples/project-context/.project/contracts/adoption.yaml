# Play-Nice adoption manifest (example)
# Pin the revision to the commit you adopt. '0000000' is the documented
# placeholder — contractctl adopt reports it as "pin before use".
schema: play-nice/adoption-v1
project: example-project
source:
  repository: Rylee-Bee/play-nice-contracts
  revision: 0000000

always:
  - truth-and-evidence
  - status-and-state
  - ask-for-help
  - project-context
  - working-together

triggers:
  ui:
    - accessibility
    - design-fidelity

notes: >-
  Example adoption for the project-context structure. Real projects pin a
  real SHA and add trigger surfaces as they grow.