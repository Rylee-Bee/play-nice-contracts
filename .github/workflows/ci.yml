name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: pip install pytest

      - name: Validate library
        run: python3 tools/contractctl/contractctl.py validate

      - name: Lock determinism (regenerate twice, byte-compare)
        run: |
          cp contracts.lock.json /tmp/lock-baseline.json
          python3 tools/contractctl/contractctl.py lock
          cmp /tmp/lock-baseline.json contracts.lock.json && echo "lock regeneration byte-identical"

      - name: Full test suite
        run: python3 -m pytest tests/ -q

      - name: Secret / private-material scan (library surfaces)
        run: python3 - <<'EOF'
        import subprocess, sys
        from pathlib import Path
        banned = ["gh" + "p_", "gh" + "o_", "AK" + "IA",
                  "BEGIN PRIVATE " + "KEY", "BEGIN " + "RSA",
                  "192.168" + ".", "hulganfamily.duck" + "dns.org", "10.0" + "."]
        repo = Path(".")
        hits = []
        for f in repo.rglob("*"):
            if not f.is_file() or any(p in f.parts for p in (".git", ".venv", "__pycache__", ".pytest_cache", ".contract-commitments")):
                continue
            try:
                text = f.read_text()
            except (UnicodeDecodeError, ValueError):
                continue
            for b in banned:
                if b in text:
                    hits.append(f"{f}: contains {b!r}")
        if hits:
            print("\n".join(hits))
            sys.exit(1)
        print("secret/private-material scan clean")
        EOF