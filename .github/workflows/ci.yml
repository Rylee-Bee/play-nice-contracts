name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  library:
    name: validate + lock determinism + tests + private-material scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install test runner
        run: pip install pytest

      - name: Validate CI workflow YAML parses and defines the expected job
        run: |
          pip install pyyaml
          python3 - <<'PYEOF'
          import sys
          try:
              import yaml
          except ImportError:
              print("pyyaml unavailable; skipping strict parse (non-fatal)")
              sys.exit(0)
          with open(".github/workflows/ci.yml") as f:
              doc = yaml.safe_load(f)
          assert isinstance(doc, dict), "workflow root must be a mapping"
          jobs = doc.get("jobs") or {}
          assert "library" in jobs, "expected job 'library' missing"
          steps = jobs["library"].get("steps") or []
          names = [s.get("name") or s.get("uses") or "?" for s in steps]
          for expected in ["Validate library", "Full test suite",
                           "Secret / private-material scan (library surfaces)"]:
              assert expected in names, f"expected step {expected!r} missing"
          print("workflow YAML valid; job and steps present:", names)
          PYEOF

      - name: Validate library
        run: python3 tools/contractctl/contractctl.py validate

      - name: Lock determinism (regenerate twice, byte-compare)
        run: |
          cp contracts.lock.json /tmp/lock-baseline.json
          python3 tools/contractctl/contractctl.py lock
          cmp /tmp/lock-baseline.json contracts.lock.json && echo "lock regeneration byte-identical"

      - name: Full test suite
        run: python3 -m pytest tests/ -q

      - name: Secret / private-material scan (library surfaces)
        run: |
          python3 - <<'PYEOF'
          import sys
          from pathlib import Path
          banned = ["gh" + "p_", "gh" + "o_", "AK" + "IA",
                    "BEGIN PRIVATE " + "KEY", "BEGIN " + "RSA",
                    "192.168" + ".", "hulganfamily.duck" + "dns.org", "10.0" + "."]
          repo = Path(".")
          hits = []
          for f in repo.rglob("*"):
              if not f.is_file() or any(p in f.parts for p in (".git", ".venv", "__pycache__", ".pytest_cache", ".contract-commitments")):
                  continue
              try:
                  text = f.read_text()
              except (UnicodeDecodeError, ValueError):
                  continue
              for b in banned:
                  if b in text:
                      hits.append(f"{f}: contains {b!r}")
          if hits:
              print("\n".join(hits))
              sys.exit(1)
          print("secret/private-material scan clean")
          PYEOF
